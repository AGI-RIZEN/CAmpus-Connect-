services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_connect
    ports:
      - '5432:5432'
    volumes:
      - campus_connect_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - campus_connect_redisdata:/data

volumes:
  campus_connect_pgdata:
  campus_connect_redisdata:
